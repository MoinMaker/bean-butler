# Add these entries to your ESPHome secrets.yaml (in Home Assistant: /config/esphome/secrets.yaml).
# Never share your real secrets.yaml.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
# 32-byte base64 key – ESPHome generates one when you create a new device, or see
# https://esphome.io/components/api.html (encryption key generator)
bean_butler_api_key: "REPLACE_WITH_YOUR_OWN_KEY="
bean_butler_ota_password: "choose-a-password"
